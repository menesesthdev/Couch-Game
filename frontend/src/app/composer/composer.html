<form class="composer" [formGroup]="form" (ngSubmit)="submeter()">
  <input
    class="perfil"
    formControlName="perfil"
    placeholder="Cole o link do tracker.gg ou digite nome#tag"
    autocomplete="off"
    spellcheck="false"
    aria-label="Perfil"
  />

  <div class="barra">
    <div class="opcoes">
      <label class="pill">
        <span class="sr-only">Região</span>
        <select formControlName="regiao">
          @for (r of regioes; track r.valor) {
            <option [value]="r.valor">{{ r.nome }}</option>
          }
        </select>
      </label>

      <label class="pill" [class.vazio]="!form.controls.rankAlvo.value">
        <span class="prefixo">Meta</span>
        <select formControlName="rankAlvo" aria-label="Rank-alvo">
          <option value="" disabled>rank</option>
          @for (r of ranks(); track r.tier) {
            <option [value]="r.tier">{{ r.nome }}</option>
          }
        </select>
      </label>

      <label class="pill">
        <span class="prefixo">até</span>
        <input type="date" formControlName="dataLimite" [min]="amanha" aria-label="Data-limite" />
      </label>
    </div>

    <button class="enviar" type="submit" [disabled]="form.invalid || carregando()" aria-label="Estimar">
      @if (carregando()) {
        <span class="parar"></span>
      } @else {
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M10 16V4M10 4L5 9M10 4l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      }
    </button>
  </div>
</form>
