services:
  postgres:
    image: postgres:17-alpine
    container_name: coachgame-postgres
    environment:
      POSTGRES_DB: coachgame
      POSTGRES_USER: coachgame
      POSTGRES_PASSWORD: coachgame
    ports:
      - "5432:5432"
    volumes:
      - coachgame-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coachgame -d coachgame"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    container_name: coachgame-api
    environment:
      ConnectionStrings__ValorantCoach: Host=postgres;Port=5432;Database=coachgame;Username=coachgame;Password=coachgame
      HenrikDev__ApiKey: ${HENRIKDEV_API_KEY:-}
      Banco__MigrarAoIniciar: "true"
    ports:
      - "5080:8080"
    # O Docker herda o resolv.conf do host. Com uma VPN de DNS próprio (Tailscale/MagicDNS),
    # vem junto um "search <dominio>" que transforma "postgres" em "postgres.<dominio>" e
    # quebra a resolução dos nomes de serviço. O "." zera esse search sem afetar DNS externo.
    dns_search: "."
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./frontend
    container_name: coachgame-web
    ports:
      - "4200:80"
    dns_search: "."
    depends_on:
      - api

volumes:
  coachgame-pgdata:
